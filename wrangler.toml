name = "bounce"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/signal", "/feed", "/health", "/turn", "/auth/*", "/api/*"]

[vars]
ALLOWED_ORIGINS = "https://bounce.jam06452.uk,https://bounce.danjward8.workers.dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "FEED"
class_name = "Feed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Feed"]

[[d1_databases]]
binding = "DB"
database_name = "bounce"
database_id = "b481e550-2a1f-497a-b032-c6fa25445c48"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "BOARD"
id = "822fc3cc6b1c4bdca2589c0ab31df364"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
