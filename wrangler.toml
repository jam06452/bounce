name = "bounce"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/signal", "/health", "/turn", "/auth/*", "/api/*"]

[vars]
ALLOWED_ORIGINS = "https://bounce.jam06452.uk,https://bounce.danjward8.workers.dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[d1_databases]]
binding = "DB"
database_name = "bounce"
database_id = "b481e550-2a1f-497a-b032-c6fa25445c48"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "BOARD"
id = "822fc3cc6b1c4bdca2589c0ab31df364"

[observability.logs]
enabled = true
invocation_logs = true
